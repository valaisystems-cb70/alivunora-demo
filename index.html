const flows=[
{id:'scene',area:'My Future',title:'Future Scenes',icon:'▧',sub:'Personal visions, intentions, images and music.',action:'New scene',steps:[['Scene name *','My dream life'],['Describe the experience *','I wake up to the sound of the ocean. I enjoy my morning coffee on the terrace, feeling free and grateful.'],['Your personal intention','Living with freedom, joy and presence.'],['Feelings associated with this scene','Peace, freedom and gratitude.'],['Your image','1','image'],['Personal music (optional)','My personal inspiration music','music']]},
{id:'goals',area:'My Future',title:'Three Phase Goal Setting',icon:'◎',sub:'Vision → Definite Chief Aim → Next Logical Step.',action:'Create a goal',steps:[['Give this goal a name *','A life with more freedom'],['What would you love to experience?','A life where I have the freedom to choose how I spend my time.','text','Vision'],['What is your clear aim?','Create a sustainable business that allows me to work from anywhere.','text','Definite Chief Aim'],['What is the next step you can take?','Make a clear plan for my next business opportunity.','text','Next Logical Step'],['What could pull you off track?','Overthinking, unnecessary tasks and trying to do everything at once.','text','Avoid OTDs']]},
{id:'slingshot',area:'My Future',title:'The Slingshot',icon:'◉',sub:'Past Self → Present Self → Future Self.',action:'New reflection',steps:[['Give this reflection a name *','My journey toward freedom'],['What do you remember about who you were?','I used to believe that success meant working harder and sacrificing my freedom.','text','Past Self'],['Who are you today?','I am more aware of what matters to me and what I want from life.','text','Present Self'],['Who are you becoming?','Someone who creates opportunities, enjoys life and acts with confidence.','text','Future Self']]},
{id:'morning',area:'Today',title:'Start Your Day',icon:'☀',sub:'A new day. A fresh possibility.',action:'Begin',steps:[['How would you like to feel today?','Calm','morning'],['What matters most today?','Taking one meaningful step toward my future.'],['A thought to take with you',"I don't have to do everything today. One meaningful step is enough."]]},
{id:'evening',area:'Today',title:'End Your Day',icon:'☾',sub:'Every day has something to teach us.',action:'Begin',steps:[['How are you feeling as the day ends?','Grateful','evening'],['What stood out to you today?','I had an inspiring conversation that opened up a new possibility.'],['What would you like to take into tomorrow?','Stay curious and open to new opportunities.']]},
{id:'journal',area:'My Journey',title:'Personal Journal',icon:'♡',sub:'Remember, recognize and reflect.',action:'Capture a Moment',steps:[['Choose a category','Gratitude','journalcat'],['Give your moment a title','A beautiful moment of clarity'],['What happened?','I took time to reflect and realized how much progress I have already made.'],['Why does it matter?','It reminded me to appreciate the journey, not only the destination.'],['Connect to a Future Scene','My dream life','link']]},
{id:'opportunities',area:'My Journey',title:'Opportunities',icon:'◇',sub:'Notice meaningful people, places and possibilities.',action:'Capture an opportunity',steps:[['Give this opportunity a name','An unexpected connection'],['Choose a category','People','opcat'],['Your observation','I met someone who shared an interesting perspective on my plans.'],['Why is this meaningful to you?','It gave me a new idea worth exploring.'],['Follow the Nudge','I felt curious and decided to start a conversation.','text','The CHO Model'],['Meet the Connection','We discovered that we have some shared interests.','text','The CHO Model'],['Receive the Opportunity','I could explore a possible collaboration without assuming the outcome.','text','The CHO Model'],['Connect to a Future Scene','My dream life','link']]},

{id:'lens',area:'My Growth',title:'Change the Lens',icon:'◉',sub:'One situation. Different perspectives.',action:'New reflection',steps:[['Give this reflection a name *','Seeing uncertainty differently'],['Describe the event, situation or challenge','Something I had hoped would happen has been delayed.','text','The Situation'],['Capture your current interpretation in your own words','I feel as though I am not moving forward.','text','My Current Lens'],['Is there another way to understand this — without dismissing what you experienced?','The delay may give me time to explore alternatives and prepare.','text','Another Perspective'],['Record the perspective you want to consider moving forward with','I can acknowledge my disappointment and still choose a constructive next step.','text','The Lens I Choose']]}];
const by=id=>flows.find(f=>f.id===id);let device='Mobile',page='Home',mode='overview',fid='scene',step=0,values=[],records=[],scenes=[],active=null,selected=null,playing=false,rid=null,origin='My Future',filter='All',info=false,sceneTest=false,recordOrigin='journal';const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arg=x=>E(JSON.stringify(x));const btn=(label,call,cls='')=>`<button class="${cls}" onclick="${call}">${label}</button>`;const call=(fn,...args)=>`${fn}(${args.map(arg).join(',')})`;const icon=s=>`<span class="ico" aria-hidden="true">${s}</span>`;const row=(i,t,sub,action)=>btn(`${icon(i)}<span class="grow"><strong>${E(t)}</strong><small>${E(sub)}</small></span><span class="gold">›</span>`,action,'row');const done=id=>id==='scene'?sceneTest:records.some(r=>r.fid===id);const current=()=>scenes.find(s=>s.id===selected);const activeScene=()=>scenes.find(s=>s.id===active);const journal=()=>records.filter(r=>r.fid!=='goals');const titleOf=r=>r.fid==='morning'?'Morning Reflection':r.fid==='evening'?'Evening Reflection':r.fid==='journal'?r.values[1]:r.values[0];
function reset(blank){records=[];scenes=blank?[]:[{id:1,name:'My dream home',description:'A peaceful morning by the ocean.',intention:'Living with freedom and presence.',feelings:'Peace, freedom and gratitude',image:'1',music:''},{id:2,name:'A life of freedom',description:'Exploring new places and possibilities.',intention:'Being open to new possibilities.',feelings:'Joy and adventure',image:'2',music:''}];active=blank?null:1;selected=active;playing=false;sceneTest=false;filter='All';go('Home')}
function deviceTo(d){device=d;render()}function go(p){page=p;mode='overview';step=0;info=false;render()}function setMode(m){mode=m;render()}function hub(id){fid=id;page=by(id).area;mode='hub';info=false;filter='All';render()}function start(id,r=null){fid=id;page=by(id).area;values=r?r.values.slice():by(id).steps.map(s=>s[2]==='link'?(activeScene()?.name||'None'):s[1]);rid=r?.id??null;step=0;mode='focus';render()}function launch(id){if(id==='scene')start(id);else if(id==='morning'||id==='evening'){start(id,records.find(r=>r.fid===id)||null)}else hub(id)}function val(v){values[step]=v;render()}function jump(n){step=n;render()}function next(){if(step<by(fid).steps.length-1)step++;else mode='review';render()}function save(){if(fid==='scene'){let id=rid??Math.max(0,...scenes.map(s=>s.id))+1;let s={id,name:values[0]||'My Future Scene',description:values[1],intention:values[2],feelings:values[3],image:values[4],music:values[5]};scenes=rid===null?[...scenes,s]:scenes.map(x=>x.id===id?s:x);selected=id;origin='My Future';sceneTest=true;mode='sceneDetail'}else{let id=rid??(fid==='morning'?-1:fid==='evening'?-2:Math.max(0,...records.map(r=>r.id))+1);records=[{id,fid,values:values.slice()},...records.filter(r=>r.id!==id)];rid=id;mode='saved'}render()}function viewScene(id,from){selected=id;origin=from;mode='sceneDetail';render()}function activate(){active=selected;render()}function editScene(){let s=current();fid='scene';page='My Future';rid=s.id;values=[s.name,s.description,s.intention,s.feelings,s.image,s.music];step=0;mode='focus';render()}function slide(d){selected=scenes[(scenes.findIndex(s=>s.id===selected)+d+scenes.length)%scenes.length].id;render()}function showRecord(id,from){let r=records.find(r=>r.id===id);if(!r)return;recordOrigin=from;fid=r.fid;rid=id;values=r.values.slice();mode='record';render()}function toggleMusic(){playing=!playing;render()}function back(){if(mode==='focus'&&step>0)return jump(step-1);if(mode==='review'){step=by(fid).steps.length-1;return setMode('focus')}if(mode==='immersive')return setMode('sceneDetail');if(mode==='sceneDetail')return go(origin);if(mode==='record')return recordOrigin==='recent'?go('My Journey'):hub(recordOrigin);if(mode==='focus'||mode==='saved'){if(fid==='scene')return go('My Future');if(by(fid).area==='Today'){page='Today';return setMode('daily')}return hub(fid)}go(page==='Profile'?'Home':page)}
function picture(n){if(!['1','2','3'].includes(n))return `<div class="picture center">${icon('▧')}</div>`;let art=n==='1'?`<path d="M0 250H640V360H0Z" fill="#2b6674"/><path d="M0 281L640 265V360H0Z" fill="#d4c6a9"/><path d="M180 278L540 278L630 360H90Z" fill="#5cabb6"/><path d="M0 110H230V270H0Z" fill="#e6d5be"/><path d="M0 95H270V117H0Z" fill="#faf0dc"/><path d="M30 140H190V250H30Z" fill="#344a57"/><path d="M590 255Q570 165 604 109" stroke="#463d36" stroke-width="10" fill="none"/><path d="M604 109Q535 65 510 118Q556 100 604 109Q653 64 640 133Q625 112 604 109Q551 133 560 175Q580 139 604 109" fill="#456951"/>`:n==='2'?`<path d="M0 210H640V360H0Z" fill="#376c80"/><path d="M0 267Q160 247 320 267T640 267M0 320Q160 300 320 320T640 320" stroke="#b2d2d6" opacity=".55" fill="none"/><path d="M230 271H445L408 294H263Z" fill="#f2e4cb"/><path d="M330 116V268H241Z" fill="#f7e7cb"/><path d="M339 142V268H411Z" fill="#dbb48c"/>`:`<path d="M0 277L112 120L228 252L357 82L526 254L640 140V360H0Z" fill="#56627d"/><path d="M112 120L67 183L112 166L153 184ZM357 82L294 164L350 146L397 164Z" fill="#e8ded1"/><path d="M0 284Q140 250 270 287T640 278V360H0Z" fill="#9ea7b3"/><path d="M0 325Q140 282 280 325T640 315V360H0Z" fill="#d2c6bb"/>`;return `<div class="picture"><svg viewBox="0 0 640 360" role="img" aria-label="Illustrative ${n==='1'?'beachfront home':n==='2'?'sailing scene':'mountain scene'}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky${n}" x2="0" y2="1"><stop stop-color="#202c50"/><stop offset=".65" stop-color="#d7a17d"/><stop offset="1" stop-color="#f4d9a7"/></linearGradient></defs><rect width="640" height="360" fill="url(#sky${n})"/><circle cx="440" cy="160" r="39" fill="#ffe1a6"/>${art}</svg></div>`}
function hero(){return `<div class="hero"><small>YOUR PERSONAL SPACE</small><h1>${page==='Home'?'A little closer,<br>every day.':E(page)}</h1>${page==='Home'?'':`<p>${E(nav.find(n=>n[0]===page)?.[2]||'Your personal settings')}</p>`}</div>`}
function overview(){let h=hero();if(page==='Home'){return h+`<div class="grid">${nav.slice(1).map((n,i)=>btn(`${icon(n[1])}<strong>${n[0]}</strong><small>${['Imagine your future','Live with intention','Every step matters','Become more of you'][i]}</small>`,call('go',n[0]),'tile')).join('')}</div>`+row('✦','Your next step',!activeScene()?'Create your first Future Scene':!done('morning')?'Start Your Day':!done('evening')?'Connect with your future':'Explore your journey',!activeScene()?call('start','scene'):!done('morning')?call('launch','morning'):!done('evening')?call('go','Today'):call('go','My Journey'))}if(page==='My Future'){return h+`<div class="flex"><h2>Future Scenes</h2>${btn('+ New scene',call('start','scene'))}</div>`+(scenes.length?`<div class="scroll">${scenes.map(s=>btn(picture(s.image)+`<span class="caption"><strong>${E(s.name)}</strong><small class="gold">${active===s.id?'✓ Active Future Scene':'Open scene'} ›</small></span>`,call('viewScene',s.id,page),'scene')).join('')}</div>`:`<div class="card center"><h2>No scenes yet</h2><p>Create your first Future Scene — name the experience, add your image, and capture the intention it holds for you.</p>${btn('Create your first scene',call('start','scene'),'primary')}</div>`)+flows.filter(f=>f.area===page&&f.id!=='scene').map(f=>row(f.icon,f.title,f.sub,call('hub',f.id))).join('')}if(page==='Today'){let s=activeScene();return h+(s?btn(picture(s.image)+`<div class="caption"><small class="gold">ACTIVE FUTURE SCENE · FROM MY FUTURE</small><h2>${E(s.name)}</h2><p>${E(s.intention||s.description)}</p></div>`,call('viewScene',s.id,page),'scene sceneBig')+`<div class="flex">${btn('Change scene',call('go','My Future'),'ghost')}${s.music?btn(playing?'Pause music':'Play music','toggleMusic()','ghost'):''}</div>`:`<div class="card"><h2>Choose a scene for today</h2>${btn('Go to My Future',call('go','My Future'),'primary')}</div>`)+row('☀','Daily Focus',done('morning')?'Your morning is ready.':'Start and end your day with intention.',call('setMode','daily'))+`<div class="grid">${['morning','evening'].map(x=>btn(`${done(x)?'✓':'○'} ${x==='morning'?'Morning':'Evening'}`,call('launch',x))).join('')}</div>`}if(page==='My Journey'||page==='My Growth'){h+=flows.filter(f=>f.area===page).map(f=>row(f.icon,f.title,f.sub,call('hub',f.id))).join('');if(page==='My Journey')return h+`<div class="flex"><h2>Your recent moments</h2>${btn('View all',call('hub','journal'),'ghost')}</div>`+(journal().length?journal().slice(0,3).map(r=>recordRow(r,'recent')).join(''):row('+','Capture a Moment','Start your personal journal.',call('start','journal')));return h+row('◎','Belief Patterns','Twelve reflection patterns · Planned',call('setMode','planned'))+`<div class="card"><strong class="gold">Explore, gently.</strong><small>No forced positivity. No invented assessments. A personal space to explore your own perspectives.</small></div>`}return h+`<div class="card center"><h2>Demo profile</h2><small>Personal settings preview</small></div>`+['Profile','AI Coach','Privacy'].map(s=>`<div class="card">${s}<small>Not in demo scope</small></div>`).join('')+btn('Back to Home',call('go','Home'))}
function daily(){return `<div class="center">${icon('☼')}<h1>Daily Focus</h1><small>A calm daily rhythm</small></div><div class="${device==='Desktop'?'grid':''}" style="display:grid;gap:12px">${flows.filter(f=>f.area==='Today').map(f=>btn(`<div class="flex">${icon(f.icon)}<span class="gold">${done(f.id)?'✓':'→'}</span></div><h2>${f.title}</h2><small>${f.sub}</small><span class="gold">${done(f.id)?'Completed · Edit':'Begin'}</span>`,call('launch',f.id),'card')).join('')}</div><small class="center">Choose either experience at any time.</small>`}
const phases={goals:['Vision','Definite Chief Aim','Next Logical Step','Avoid OTDs'],slingshot:['Past Self','Present Self','Future Self'],beliefs:['Recognize the Belief','Explore the Belief','Choose a New Perspective'],lens:['The Situation','My Current Lens','Another Perspective','The Lens I Choose'],opportunities:['Follow the Nudge','Meet the Connection','Receive the Opportunity']};function recordRow(r,from){return row(by(r.fid).icon,titleOf(r),r.fid==='journal'?r.values[0]:by(r.fid).title,call('showRecord',r.id,from))}function hubView(){let f=by(fid);let r=fid==='journal'?journal():records.filter(r=>r.fid===fid);let fs=['All','Gratitude','Small Wins','Insights','Synchronicities','Experiences','Morning Reflection','Evening Reflection','Opportunities','Growth','Slingshot'];if(fid==='journal'&&filter!=='All')r=r.filter(x=>x.fid==='journal'?x.values[0]===filter:filter==='Morning Reflection'?x.fid==='morning':filter==='Evening Reflection'?x.fid==='evening':filter==='Opportunities'?x.fid==='opportunities':filter==='Growth'?['beliefs','lens'].includes(x.fid):filter==='Slingshot'?x.fid==='slingshot':false);return `<div class="card center">${icon(f.icon)}<h1>${f.title}</h1><small>${f.sub}</small></div>`+(phases[fid]||[]).map((p,i)=>`<div class="phase"><b>${i+1}</b>${p}</div>`).join('')+btn('+ '+f.action,call('start',fid),'primary')+btn('How it works '+(info?'⌃':'⌄'),'info=!info;render()','ghost')+(info?`<div class="card">${E(f.sub)}${fid==='opportunities'?'<small>Personal observations, not evidence or guarantees of manifestation.</small>':''}</div>`:'')+`<h2>${fid==='journal'?'Your Journal':fid==='goals'?'Your Goals':'Your Reflections'}</h2>`+(fid==='journal'?`<select aria-label="Filter journal" onchange="filter=this.value;render()">${fs.map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select>`:'')+(r.length?r.map(x=>recordRow(x,fid)).join(''):'<small>No entries yet. Your journey starts here.</small>')}
function focusView(){let f=by(fid),s=f.steps[step],v=values[step],choices={morning:[['🌿','Calm'],['☀️','Energized'],['✨','Confident'],['🦋','Open']],evening:[['😊','Happy'],['🌿','Calm'],['🌤️','Mixed'],['🌙','Tired'],['🌧️','Challenged'],['💛','Grateful']],journalcat:['Gratitude','Small Wins','Insights','Synchronicities','Experiences'].map(x=>['',x]),opcat:['People','Places','Events','Opportunities','Synchronicities'].map(x=>['',x])};let field=choices[s[2]]?`<div class="grid">${choices[s[2]].map(c=>btn(`${c[0]?icon(c[0]):''}${E(c[1])}${v===c[1]?' ✓':''}`,call('val',c[1]),'choice '+(v===c[1]?'sel':''))).join('')}</div>`:s[2]==='image'?`<div class="grid" style="grid-template-columns:repeat(3,1fr)">${['1','2','3'].map((n,i)=>btn(picture(n)+['Home','Freedom','Adventure'][i]+(v===n?' ✓':''),call('val',n),'choice '+(v===n?'sel':''))).join('')}</div><small>Example image selected. Personal upload remains part of the real app.</small>`:s[2]==='music'?row('♫',v||'Add personal music','Optional · simulated selection',call('val',v?'':'My personal inspiration music')):s[2]==='link'?`<select aria-label="Future Scene" onchange="val(this.value)">${[...scenes.map(x=>x.name),'None'].map(n=>`<option ${n===v?'selected':''}>${E(n)}</option>`).join('')}</select><small>Optional connection to one of your existing scenes.</small>`:`<textarea aria-label="${E(s[0])}" oninput="values[step]=this.value">${E(v)}</textarea><small>Prefilled demo answer · Edit if you like.</small>`;return `<div class="focus"><div class="center">${icon(f.icon)}<h2>${f.title}</h2><small>${f.sub}</small></div><div class="flex"><small class="gold">STEP ${step+1} OF ${f.steps.length}</small><small>${step+1}/${f.steps.length}</small></div><div class="progress">${f.steps.map((_,i)=>btn('',call('jump',i),i<=step?'on':'')).join('')}</div><div class="card center" style="justify-items:stretch">${s[3]?`<small class="gold">${s[3].toUpperCase()}</small>`:''}<h2>${E(s[0])}</h2>${field}</div>${btn(step===f.steps.length-1?'Review →':'Continue →','next()','primary')}<div class="flex">${btn('← Back','back()','ghost')}<small>${f.steps.map((_,i)=>i===step?'●':'○').join(' ')}</small></div></div>`}
function summaryView(){let f=by(fid),review=mode==='review';return `<div class="focus"><div class="center">${icon(review?'▤':'✓')}<h1>${review?'Review your '+(fid==='scene'?'scene':fid==='goals'?'goal':'reflection'):mode==='saved'?(fid==='morning'?'Your morning is ready.':fid==='evening'?'Your evening reflection is ready.':'Saved in your demo'):'Your reflection'}</h1></div><div class="card summary">${f.steps.map((s,i)=>`<div><small class="gold">${E(s[3]||s[0])}</small>${s[2]==='image'?picture(values[i]):`<p>${E(values[i]||'—')}</p>`}</div>`).join('')}</div>`+(review?btn(({scene:'Save scene',morning:'Save My Morning',evening:'Save My Evening',goals:'Save goal'})[fid]||'Save reflection','save()','primary')+btn('Back to edit','setMode(\'focus\')','ghost'):(fid!=='goals'?'<div class="good">✓ Available in your Personal Journal.</div>':'')+btn('Back to '+(f.area==='Today'?'Today':f.title),f.area==='Today'?call('go','Today'):call('hub',fid),'primary')+btn('View My Journal',call('hub','journal'),'ghost')+btn('Edit answers','step=0;page=by(fid).area;setMode(\'focus\')','ghost'))+'</div>'}
function detail(){let s=current();if(!s)return '<p>No scene selected.</p>';let immersive=mode==='immersive';return `<div class="${immersive?'immersive':''} card">${picture(s.image)}<small class="gold">${s.id===active?'ACTIVE FUTURE SCENE':'FUTURE SCENE'}</small><h1>${E(s.name)}</h1><p>${E(immersive?s.intention:s.description)}</p></div><div class="card"><small class="gold">INTENTION</small><p>${E(s.intention||'—')}</p><small class="gold">FEELINGS</small><p>${E(s.feelings||'—')}</p></div>`+(s.music?btn((playing?'Pause':'Play')+' music · Demo','toggleMusic()','ghost'):'')+(immersive?`<div class="flex">${btn('‹',call('slide',-1))}<small>${scenes.map(x=>x.id===selected?'●':'○').join(' ')}</small>${btn('›',call('slide',1))}</div>${btn('Close experience',call('setMode','sceneDetail'),'ghost')}`:`<button class="primary" onclick="activate()" ${s.id===active?'disabled':''}>${s.id===active?'✓ Active Future Scene':'Select for Today'}</button>${btn('Experience your scene ⛶',call('setMode','immersive'),'ghost')}${s.id===active?btn('Go to Today →',call('go','Today'),'ghost'):''}${btn('Edit Future Scene','editScene()','ghost')}`)}
function render(){let mobile=device==='Mobile',focused=['focus','review','immersive'].includes(mode);let content=mode==='overview'?overview():mode==='daily'?daily():mode==='hub'?hubView():mode==='focus'?focusView():['review','saved','record'].includes(mode)?summaryView():['sceneDetail','immersive'].includes(mode)?detail():`<div class="center"><h1>Belief Patterns</h1><p>Twelve personal reflection patterns.</p><div class="card">Content pending approval. No exercises have been invented.</div>${btn('Back to My Growth',call('go','My Growth'))}</div>`;let navigation=nav.map(n=>btn(`${icon(n[1])}<span>${mobile?n[0].replace('My ',''):n[0]}</span>`,call('go',n[0]),page===n[0]?'active':'')).join('');document.querySelector('#app').innerHTML=`<div class="shell ${mobile?'mobile':'desktop'}"><div class="status">${mobile?'<span>9:41</span><span style="background:#040710;width:78px;height:18px;border-radius:20px"></span><span>▰ ▰</span>':'<span>🔴 🟡 🟢</span><span>ALIVUNORA</span><span>□</span>'}</div><div class="body">${!mobile&&!focused?`<aside class="side"><div class="brand">ALIVUNORA</div>${navigation}<div class="spacer"></div>${btn('◯ My profile',call('go','Profile'))}</aside>`:''}<main class="main"><header class="header">${mode!=='overview'||page==='Profile'?btn('‹','back()'):icon('✦')}<span class="brand">${mobile?'ALIVUNORA':E(page.toUpperCase())}</span>${btn(focused?'×':'◯',focused?'back()':call('go','Profile'))}</header>${content}<div class="spacer"></div>${playing?`<div class="musicbar flex"><small>♫ Your scene music · UI preview</small>${btn('Ⅱ','toggleMusic()')}</div>`:''}</main></div>${mobile&&!focused?`<nav class="nav">${navigation}</nav>`:''}${mobile?'<div style="width:96px;height:4px;border-radius:10px;background:#a6b1c4;margin:8px auto"></div>':''}</div>`;document.querySelector('#mobile').classList.toggle('selected',mobile);document.querySelector('#desktop').classList.toggle('selected',!mobile);document.querySelector('#count').textContent=flows.filter(f=>done(f.id)).length+' / 9 flows';document.querySelector('#testgrid').innerHTML=flows.map(f=>btn(`${done(f.id)?'✓':'○'} ${f.title}`,call('launch',f.id))).join('')}
reset(false);
</script></body></html>
